<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --subtext-color: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
        }

        .api-setup, .search-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: var(--text-color);
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: var(--accent-color);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .card img {
            width: 80px;
            border-radius: 4px;
        }

        .card-details {
            flex: 1;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .meta {
            color: var(--subtext-color);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            background-color: #333;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }

        .summary-box {
            background-color: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        .summary-box.active {
            display: block;
        }

        .next-ep-box {
            margin-top: 8px;
            padding: 8px;
            background-color: #1a3738;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Media Tracker</h1>

    <!-- API Key Input -->
    <div class="api-setup">
        <input type="password" id="apiKey" placeholder="Enter your TMDb API Key (v3)...">
        <button onclick="saveApiKey()">Save Key</button>
    </div>

    <!-- Search Section -->
    <div class="search-box">
        <input type="text" id="searchQuery" placeholder="Search for a movie or TV show..." onkeypress="handleKeyPress(event)">
        <button onclick="searchMedia()">Search</button>
    </div>

    <!-- Search Results Container -->
    <div id="results" class="results-list"></div>
</div>

<script>
    // Initialize API Key on page load
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("tmdb_api_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
        }
    });

    function saveApiKey() {
        const key = document.getElementById("apiKey").value.trim();
        if (key) {
            localStorage.setItem("tmdb_api_key", key);
            alert("API Key saved locally!");
        } else {
            alert("Please enter a valid key.");
        }
    }

    function getApiKey() {
        return localStorage.getItem("tmdb_api_key") || document.getElementById("apiKey").value.trim();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') searchMedia();
    }

    async function searchMedia() {
        const apiKey = getApiKey();
        const query = document.getElementById("searchQuery").value.trim();
        const resultsContainer = document.getElementById("results");

        if (!apiKey) {
            alert("Please provide a TMDb API Key first.");
            return;
        }

        if (!query) return;

        resultsContainer.innerHTML = "<p>Searching...</p>";

        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${apiKey}&query=${encodeURIComponent(query)}`);
            const data = await res.json();

            resultsContainer.innerHTML = "";

            if (!data.results || data.results.length === 0) {
                resultsContainer.innerHTML = "<p>No results found.</p>";
                return;
            }

            data.results.forEach(item => {
                if (item.media_type === "movie" || item.media_type === "tv") {
                    renderCard(item);
                }
            });
        } catch (err) {
            resultsContainer.innerHTML = `<p style="color: red;">Error fetching results: ${err.message}</p>`;
        }
    }

    function renderCard(item) {
        const resultsContainer = document.getElementById("results");
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || "").substring(0, 4) || "N/A";
        const poster = item.poster_path 
            ? `https://image.tmdb.org/t/p/w185${item.poster_path}` 
            : 'https://via.placeholder.com/80x120?text=No+Image';

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <img src="${poster}" alt="${title}">
            <div class="card-details">
                <div class="card-title">${title} (${year})</div>
                <div class="meta">
                    <span class="badge">${item.media_type.toUpperCase()}</span>
                    ⭐ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}/10
                </div>
                <button onclick="toggleSummary('${item.media_type}', ${item.id}, this)">Show Details & Providers</button>
                <div class="summary-box" id="summary-${item.media_type}-${item.id}"></div>
            </div>
        `;
        resultsContainer.appendChild(card);
    }

    async function toggleSummary(mediaType, id, btn) {
        const apiKey = getApiKey();
        const summaryBox = document.getElementById(`summary-${mediaType}-${id}`);

        if (summaryBox.classList.contains("active")) {
            summaryBox.classList.remove("active");
            btn.innerText = "Show Details & Providers";
            return;
        }

        summaryBox.innerHTML = "Loading details...";
        summaryBox.classList.add("active");
        btn.innerText = "Hide Details";

        try {
            const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${id}?api_key=${apiKey}&append_to_response=external_ids,watch/providers`);
            const details = await res.json();

            // Extract Streaming Providers (US Region default)
            const providersData = details['watch/providers']?.results?.US?.flatrate || [];
            const providers = providersData.length > 0 
                ? providersData.map(p => p.provider_name).join(", ") 
                : "None (Check Rent/Buy)";

            const imdbId = details.external_ids?.imdb_id;
            const imdbLink = imdbId ? `<a href="https://www.imdb.com/title/${imdbId}/" target="_blank" style="color: var(--accent-color);">IMDb Page</a>` : "N/A";

            let extraFields = "";
            let nextEpHtml = "";

            if (mediaType === "tv") {
                extraFields = `
                    <p><strong>Total Seasons:</strong> ${details.number_of_seasons} | <strong>Total Episodes:</strong> ${details.number_of_episodes}</p>
                `;

                if (details.last_episode_to_air) {
                    const last = details.last_episode_to_air;
                    extraFields += `<p><strong>Most Recent Episode:</strong> S${last.season_number}E${last.episode_number} - "${last.name}" (Aired: ${last.air_date})</p>`;
                }

                // Calculate Next Episode status
                let epStatusText = "";
                if (details.next_episode_to_air) {
                    const next = details.next_episode_to_air;
                    epStatusText = `📅 <strong>Next Episode:</strong> S${next.season_number}E${next.episode_number} airs on <strong>${next.air_date}</strong>`;
                } else if (["Ended", "Canceled"].includes(details.status)) {
                    const lastDate = details.last_episode_to_air?.air_date || "Unknown";
                    epStatusText = `🏁 <strong>Series ${details.status}:</strong> Final episode aired on <strong>${lastDate}</strong>`;
                } else {
                    epStatusText = `⏳ <strong>Status:</strong> ${details.status} (Next episode date unannounced)`;
                }

                nextEpHtml = `<div class="next-ep-box">${epStatusText}</div>`;
            }

            summaryBox.innerHTML = `
                <p><strong>Plot:</strong> ${details.overview || "No overview available."}</p>
                <p><strong>Streaming On (US):</strong> ${providers}</p>
                <p><strong>IMDb Link:</strong> ${imdbLink}</p>
                ${extraFields}
                ${nextEpHtml}
            `;
        } catch (err) {
            summaryBox.innerHTML = `<p style="color: red;">Failed to load details.</p>`;
        }
    }
</script>

</body>
</html>
