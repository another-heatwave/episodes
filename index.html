<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --fav-bg: #1b2838;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --subtext-color: #aaaaaa;
            --star-color: #ffc107;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1, h2 {
            color: var(--accent-color);
        }

        h2 {
            border-bottom: 2px solid #2a2a2a;
            padding-bottom: 8px;
            margin-top: 30px;
        }

        .search-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input, select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: var(--text-color);
            font-size: 15px;
        }

        input {
            flex: 1;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background-color: var(--accent-color);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-fav {
            background-color: #333;
            color: var(--star-color);
            font-size: 16px;
        }

        .btn-fav.active {
            background-color: #4a3e00;
        }

        .grid-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .card.fav-card {
            background-color: var(--fav-bg);
            border: 1px solid #00adb544;
        }

        .card img {
            width: 90px;
            border-radius: 4px;
            object-fit: cover;
        }

        .card-details {
            flex: 1;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta {
            color: var(--subtext-color);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            background-color: #333;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }

        .status-box {
            margin-top: 10px;
            padding: 10px;
            background-color: #16222f;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .summary-box {
            background-color: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        .summary-box.active {
            display: block;
        }

        /* --- EPISODE SECTION STYLES --- */
        .season-selector-container {
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
            margin-top: 10px;
        }

        .episode-item {
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #444;
        }

        .episode-header {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .episode-date {
            font-size: 12px;
            color: var(--subtext-color);
        }

        .episode-summary {
            font-size: 13px;
            color: #ccc;
            margin-top: 4px;
        }

        .empty-text {
            color: var(--subtext-color);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📺 TV Show Tracker</h1>

    <!-- Search Section -->
    <div class="search-box">
        <input type="text" id="searchQuery" placeholder="Search for a TV show..." onkeypress="handleKeyPress(event)">
        <button onclick="searchShows()">Search</button>
    </div>

    <!-- Favorite Shows / Main Dashboard -->
    <h2>⭐ Tracked Favorites</h2>
    <div id="favoritesList" class="grid-list">
        <p class="empty-text">No shows saved to your favorites yet. Search below to add some!</p>
    </div>

    <!-- Search Results -->
    <h2>🔍 Search Results</h2>
    <div id="searchResults" class="grid-list">
        <p class="empty-text">Search for a show above to display results.</p>
    </div>
</div>

<script>
    // Cache episode data in memory to avoid redundant API calls
    const episodeCache = {};

    document.addEventListener("DOMContentLoaded", () => {
        loadFavorites();
    });

    function handleKeyPress(e) {
        if (e.key === 'Enter') searchShows();
    }

    // --- FAVORITES MANAGEMENT ---
    function getFavorites() {
        return JSON.parse(localStorage.getItem("tracked_shows") || "[]");
    }

    function isFavorite(showId) {
        return getFavorites().some(show => show.id === showId);
    }

    function toggleFavorite(show) {
        let favs = getFavorites();
        if (isFavorite(show.id)) {
            favs = favs.filter(item => item.id !== show.id);
        } else {
            favs.push(show);
        }
        localStorage.setItem("tracked_shows", JSON.stringify(favs));
        
        loadFavorites();
        const searchInput = document.getElementById("searchQuery").value.trim();
        if (searchInput) searchShows(); 
    }

    async function loadFavorites() {
        const favsContainer = document.getElementById("favoritesList");
        const favs = getFavorites();

        if (favs.length === 0) {
            favsContainer.innerHTML = `<p class="empty-text">No shows saved to your favorites yet. Search below to add some!</p>`;
            return;
        }

        favsContainer.innerHTML = "<p>Loading tracked status...</p>";
        
        let html = "";
        for (const show of favs) {
            const details = await fetchShowDetails(show.id);
            html += renderShowCard(details, true);
        }
        favsContainer.innerHTML = html;
    }

    // --- TVMAZE API FETCHING ---
    async function searchShows() {
        const query = document.getElementById("searchQuery").value.trim();
        const resultsContainer = document.getElementById("searchResults");

        if (!query) return;

        resultsContainer.innerHTML = "<p>Searching TVMaze...</p>";

        try {
            const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
            const data = await res.json();

            resultsContainer.innerHTML = "";

            if (!data || data.length === 0) {
                resultsContainer.innerHTML = "<p class='empty-text'>No shows found.</p>";
                return;
            }

            for (const item of data) {
                const fullDetails = await fetchShowDetails(item.show.id);
                resultsContainer.innerHTML += renderShowCard(fullDetails, false);
            }
        } catch (err) {
            resultsContainer.innerHTML = `<p style="color: red;">Error searching shows: ${err.message}</p>`;
        }
    }

    async function fetchShowDetails(showId) {
        const res = await fetch(`https://api.tvmaze.com/shows/${showId}?embed[]=nextepisode&embed[]=previousepisode`);
        return await res.json();
    }

    // --- CARD RENDERING ---
    function renderShowCard(show, isFavList = false) {
        const favStatus = isFavorite(show.id);
        const poster = show.image?.medium || 'https://via.placeholder.com/90x120?text=No+Cover';
        const rating = show.rating?.average ? `${show.rating.average}/10` : 'N/A';
        const genres = show.genres?.join(", ") || "N/A";
        
        let episodeStatusHtml = "";
        const nextEp = show._embedded?.nextepisode;
        const prevEp = show._embedded?.previousepisode;

        if (nextEp) {
            episodeStatusHtml = `📅 <strong>Next Episode:</strong> S${nextEp.season}E${nextEp.number} - "${nextEp.name}" airs on <strong>${nextEp.airdate}</strong>`;
        } else if (show.status === "Ended") {
            const finalDate = prevEp ? prevEp.airdate : "Unknown";
            episodeStatusHtml = `🏁 <strong>Series Ended:</strong> Final episode aired on <strong>${finalDate}</strong>`;
        } else {
            const lastAired = prevEp ? `(Last episode: S${prevEp.season}E${prevEp.number} on ${prevEp.airdate})` : "";
            episodeStatusHtml = `⏳ <strong>Status:</strong> ${show.status} ${lastAired}`;
        }

        const cleanSummary = show.summary ? show.summary.replace(/<[^>]*>?/gm, '') : 'No overview available.';
        const showData = JSON.stringify({ id: show.id, name: show.name }).replace(/"/g, '&quot;');

        return `
            <div class="card ${isFavList ? 'fav-card' : ''}">
                <img src="${poster}" alt="${show.name}">
                <div class="card-details">
                    <div class="card-title">
                        <span>${show.name}</span>
                        <button class="btn-fav ${favStatus ? 'active' : ''}" onclick="toggleFavorite(${showData})">
                            ${favStatus ? '★ Saved' : '☆ Track Show'}
                        </button>
                    </div>
                    <div class="meta">
                        <span class="badge">⭐ ${rating}</span>
                        <span class="badge">${show.status}</span>
                        <span>${genres}</span>
                    </div>

                    <div class="status-box">
                        ${episodeStatusHtml}
                    </div>

                    <button style="margin-top: 10px;" onclick="toggleDetails(${show.id})">Toggle Details & Episodes</button>

                    <div class="summary-box" id="summary-${show.id}">
                        <p><strong>Plot:</strong> ${cleanSummary}</p>
                        <p><strong>Network / Platform:</strong> ${show.network?.name || show.webChannel?.name || 'N/A'}</p>
                        <p><strong>Official Site:</strong> ${show.officialSite ? `<a href="${show.officialSite}" target="_blank" style="color:var(--accent-color)">Visit Webpage</a>` : 'N/A'}</p>
                        
                        <!-- EPISODE LIST SECTION -->
                        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
                        <div class="season-selector-container">
                            <label for="season-select-${show.id}"><strong>Season:</strong></label>
                            <select id="season-select-${show.id}" onchange="renderSeasonEpisodes(${show.id}, this.value)">
                                <option value="">Loading seasons...</option>
                            </select>
                        </div>
                        <div id="episodes-container-${show.id}" class="episode-list"></div>
                    </div>
                </div>
            </div>
        `;
    }

    // --- EPISODE LIST & SEASON SELECTOR LOGIC ---
    async function toggleDetails(id) {
        const box = document.getElementById(`summary-${id}`);
        box.classList.toggle("active");

        // Fetch episode catalog if expanding and not already cached
        if (box.classList.contains("active") && !episodeCache[id]) {
            await loadEpisodes(id);
        }
    }

    async function loadEpisodes(showId) {
        const selectElem = document.getElementById(`season-select-${showId}`);
        const containerElem = document.getElementById(`episodes-container-${showId}`);

        try {
            const res = await fetch(`https://api.tvmaze.com/shows/${showId}/episodes`);
            const episodes = await res.json();
            
            // Cache episode array
            episodeCache[showId] = episodes;

            // Extract unique season numbers
            const seasons = [...new Set(episodes.map(ep => ep.season))].sort((a, b) => a - b);
            
            selectElem.innerHTML = "";
            seasons.forEach(season => {
                const option = document.createElement("option");
                option.value = season;
                option.textContent = `Season ${season}`;
                selectElem.appendChild(option);
            });

            // Default to rendering Season 1
            if (seasons.length > 0) {
                renderSeasonEpisodes(showId, seasons[0]);
            } else {
                containerElem.innerHTML = "<p class='empty-text'>No episode information found.</p>";
            }
        } catch (err) {
            selectElem.innerHTML = "<option value=''>Error loading seasons</option>";
            containerElem.innerHTML = `<p style="color:red;">Failed to load episodes: ${err.message}</p>`;
        }
    }

    function renderSeasonEpisodes(showId, seasonNumber) {
        const containerElem = document.getElementById(`episodes-container-${showId}`);
        const episodes = episodeCache[showId] || [];
        
        const seasonEpisodes = episodes.filter(ep => ep.season == seasonNumber);

        if (seasonEpisodes.length === 0) {
            containerElem.innerHTML = "<p class='empty-text'>No episodes found for this season.</p>";
            return;
        }

        containerElem.innerHTML = seasonEpisodes.map(ep => {
            const cleanSummary = ep.summary ? ep.summary.replace(/<[^>]*>?/gm, '') : 'No summary available.';
            const airdate = ep.airdate ? ep.airdate : 'Airdate TBA';

            return `
                <div class="episode-item">
                    <div class="episode-header">
                        <span>E${ep.number} - ${ep.name}</span>
                        <span class="episode-date">📅 ${airdate}</span>
                    </div>
                    <div class="episode-summary">${cleanSummary}</div>
                </div>
            `;
        }).join("");
    }
</script>

</body>
</html>
